{{ if .Site.Params.netlify_forms }}
<section class="contact-form-section" aria-labelledby="contact-form-title">
  <div class="single-container">
    <h2 id="contact-form-title">{{ i18n "contact-form-title" | default "Send a message" }}</h2>
    <form id="contact-form" class="higo-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <p class="higo-form__honeypot" aria-hidden="true">
        <label>Ne pas remplir <input name="bot-field"></label>
      </p>
      <p>
        <label for="contact-name">{{ i18n "contact-name" | default "Name" }}</label>
        <input id="contact-name" name="name" type="text" autocomplete="name" required>
      </p>
      <p>
        <label for="contact-email">{{ i18n "contact-email" | default "Email" }}</label>
        <input id="contact-email" name="email" type="email" autocomplete="email" required>
      </p>
      <p>
        <label for="contact-message">{{ i18n "contact-message" | default "Message" }}</label>
        <textarea id="contact-message" name="message" rows="6" required></textarea>
      </p>
      <button type="submit" class="btn-primary">{{ i18n "contact-submit" | default "Send" }}</button>
    </form>
  </div>
</section>
{{ end }}
